<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>⚽ 오늘 축구팀 편성</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:12px}.hero,.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #0001}.hero{background:#111827;color:#fff}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#d6dbe3;font-size:13px}label{font-weight:800;display:block;margin:10px 0 7px}textarea{width:100%;min-height:170px;border:1px solid #d8dde4;border-radius:12px;padding:11px;font-size:16px;line-height:1.6}.info{font-size:13px;color:#697586;margin:8px 0}.modebox,.settings,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modebox{margin:8px 0}.modebox button{background:#fff;border:1px solid #d8dde4}.modebox .active,.primary{background:#111827;color:#fff}.settings{margin-top:8px}.field{background:#f7f8fa;padding:10px;border-radius:11px}.field label{font-size:13px;margin:0 0 5px}.field input{width:100%;padding:9px;border:1px solid #d8dde4;border-radius:8px;font-size:17px;font-weight:700}button{border:0;border-radius:11px;padding:12px;font-weight:800;font-size:14px}.primary{width:100%;margin-top:9px}.secondary{background:#eef1f5}.share{background:#e9f5ff;color:#075985;width:100%;margin-top:8px}.teaminputs{display:none;grid-template-columns:1fr 1fr;gap:8px}.teaminputs.show{display:grid}.teaminputs textarea{min-height:140px}.game{border:1px solid #e0e5ea;border-radius:13px;overflow:hidden;margin:10px 0}.game h3{margin:0;padding:11px;background:#f7f8fa}.player{padding:7px 11px;border-bottom:1px solid #edf0f3}.player:last-child{border:0}.badge{font-size:11px;background:#e9f5ff;color:#075985;padding:3px 7px;border-radius:99px}.stat{display:flex;gap:6px;flex-wrap:wrap}.stat span{background:#f5f6f8;padding:7px 9px;border-radius:9px;font-size:12px}.hidden{display:none}@media(max-width:430px){.teaminputs{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>⚽ 오늘 축구팀 편성</h1><p>도착 순서대로 입력하면 출전 기회를 공평하게 배정합니다.</p></div><div class="card"><label>① 오늘 온 사람</label><textarea id="names" placeholder="도착한 순서대로 한 줄에 한 명씩"></textarea><div class="info" id="count">0명</div><label>② 편성 방식</label><div class="modebox"><button id="single" class="active" onclick="setMode('single')">⚽ 상대팀과 경기</button><button id="dual" onclick="setMode('dual')">🆚 1팀 vs 2팀</button></div><div id="dualInputs" class="teaminputs"><div><b>1팀</b><textarea id="team1" placeholder="김민수\n이철수"></textarea></div><div><b>2팀</b><textarea id="team2" placeholder="박영수\n최성민"></textarea></div></div><label>③ 경기 설정</label><div class="settings"><div class="field"><label>게임 수</label><input id="gc" type="number" min="1" max="20" value="4"></div><div class="field"><label>게임당 인원</label><input id="sz" type="number" min="1" max="30" value="10"></div></div><div class="buttons" style="margin-top:9px"><button class="secondary" onclick="sample()">예시</button><button class="secondary" onclick="clearAll()">초기화</button></div><button class="primary" onclick="make()">⚽ 자동 편성하기</button></div><div id="result" class="hidden"><div class="card"><b>편성 완료</b><div id="stats" class="stat" style="margin-top:9px"></div><button class="share" onclick="shareImage()">📸 카톡용 세로 이미지 만들기</button><button class="secondary" style="width:100%;margin-top:8px" onclick="copyText()">📋 결과 텍스트 복사</button></div><div id="games"></div></div></div><canvas id="cv" style="display:none"></canvas><script>
const $=x=>document.getElementById(x),names=$('names'),gc=$('gc'),sz=$('sz');let mode='single',data=[],last='';function list(x){let s=new Set;return x.split(/[\n,]+/).map(x=>x.trim()).filter(x=>x&&!s.has(x)&&s.add(x))}function setMode(m){mode=m;$('single').classList.toggle('active',m==='single');$('dual').classList.toggle('active',m==='dual');$('dualInputs').classList.toggle('show',m==='dual');names.style.display=m==='single'?'block':'none';$('count').style.display=m==='single'?'block':'none'}names.oninput=()=>$('count').textContent=list(names.value).length+'명';function sample(){if(mode==='single')names.value=Array.from({length:23},(_,i)=>i+1+'번 선수').join('\n');else{$('team1').value=Array.from({length:15},(_,i)=>'1팀 '+(i+1)+'번').join('\n');$('team2').value=Array.from({length:15},(_,i)=>'2팀 '+(i+1)+'번').join('\n')}names.oninput()}function clearAll(){names.value=$('team1').value=$('team2').value='';$('result').classList.add('hidden');names.oninput()}function pool(ps,g,n){let total=g*n,b=Math.floor(total/ps.length),e=total%ps.length,u=Object.fromEntries(ps.map(p=>[p,0])),t=Object.fromEntries(ps.map((p,i)=>[p,b+(i<e)])),out=[],c=0;for(let k=0;k<g;k++){let a=[],q=0;while(a.length<n&&q<ps.length*3){let p=ps[c++%ps.length];q++;if(u[p]<t[p]&&!a.includes(p)){a.push(p);u[p]++}}for(let p of ps)if(a.length<n&&!a.includes(p)&&u[p]<t[p])a.push(p),u[p]++;out.push(a)}return[out,u]}
function make(){let g=Math.max(1,+gc.value||4),n=Math.max(1,+sz.value||10);if(mode==='single'){let p=list(names.value);if(p.length<n)return alert('인원이 부족합니다.');let [a,u]=pool(p,g,n);render(a,null,u,null,g,n)}else{let a=list($('team1').value),b=list($('team2').value);if(a.length<n||b.length<n)return alert('1팀과 2팀 모두 경기당 인원 이상 입력해주세요.');let [aa,ua]=pool(a,g,n),[bb,ub]=pool(b,g,n);render(aa,bb,ua,ub,g,n)}}function render(A,B,ua,ub,g,n){data=[A,B];let s=ub?`<span>1팀 ${Math.min(...Object.values(ua))}~${Math.max(...Object.values(ua))}회</span><span>2팀 ${Math.min(...Object.values(ub))}~${Math.max(...Object.values(ub))}회</span>`:`<span>출전 ${Math.min(...Object.values(ua))}~${Math.max(...Object.values(ua))}회</span>`;$('stats').innerHTML=`<span>${ub?'1팀 vs 2팀':'상대팀 경기'}</span><span>${g}게임</span><span>${ub?'팀당':'게임당'} ${n}명</span>`+s;let h='',txt=`⚽ 오늘 축구팀 편성\n${g}게임 · ${ub?'팀당':'게임당'} ${n}명\n\n`;for(let i=0;i<g;i++){h+=`<div class="card game"><h3>${i+1}게임 <span class="badge">${ub?'1팀 vs 2팀':'우리 팀 '+n+'명'}</span></h3>`;txt+=`${i+1}게임\n`;if(ub){h+=`<b>1팀</b>`;txt+='[1팀]\n';A[i].forEach((p,j)=>{h+=`<div class="player">${j+1}. ${p}</div>`;txt+=`${j+1}. ${p}\n`});h+=`<b>2팀</b>`;txt+='\n[2팀]\n';B[i].forEach((p,j)=>{h+=`<div class="player">${j+1}. ${p}</div>`;txt+=`${j+1}. ${p}\n`})}else{A[i].forEach((p,j)=>{h+=`<div class="player">${j+1}. ${p}</div>`;txt+=`${j+1}. ${p}\n`})}h+='</div>';txt+='\n'}$('games').innerHTML=h;$('result').classList.remove('hidden');last=txt;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function copyText(){if(navigator.clipboard)navigator.clipboard.writeText(last);alert('복사했어. 카톡에 붙여넣으면 돼.')}
function shareImage(){try{const A=data[0],B=data[1],games=A.length,size=A[0]?.length||10;const c=$('cv'),ctx=c.getContext('2d');const W=900,margin=48,header=190,cardGap=22,cardH=Math.max(250,size<=10?330:330+(size-10)*27),H=header+games*cardH+(games+1)*cardGap+90;c.width=W;c.height=H;ctx.fillStyle='#f4f7f5';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0f172a';ctx.font='bold 46px system-ui, sans-serif';ctx.fillText('⚽ 오늘 축구팀 편성',margin,70);ctx.fillStyle='#087443';ctx.font='bold 25px system-ui, sans-serif';ctx.fillText(`${games}게임  ·  ${B?'팀당':'게임당'} ${size}명`,margin,112);ctx.fillStyle='#64748b';ctx.font='20px system-ui, sans-serif';ctx.fillText(B?'1팀 vs 2팀':'상대팀 경기',margin,145);let y=header+cardGap;for(let i=0;i<games;i++){const x=margin,w=W-margin*2;roundRect(ctx,x,y,w,cardH,22,'#ffffff');ctx.fillStyle='#0f766e';ctx.font='bold 27px system-ui, sans-serif';ctx.fillText(`${i+1}게임`,x+24,y+45);if(B){const mid=x+w/2;ctx.fillStyle='#0f766e';ctx.font='bold 20px system-ui, sans-serif';ctx.fillText('1팀',x+25,y+82);ctx.fillText('2팀',mid+20,y+82);for(let j=0;j<size;j++){drawPlayer(ctx,j+1,A[i][j]||'',x+25,y+125+j*26,mid-20);drawPlayer(ctx,j+1,B[i][j]||'',mid+20,y+125+j*26,x+w-25)}}else{const mid=x+w/2;ctx.fillStyle='#0f766e';ctx.font='bold 20px system-ui, sans-serif';ctx.fillText('우리 팀',x+25,y+82);for(let j=0;j<size;j++){const col=j<Math.ceil(size/2)?0:1;const row=col?j-Math.ceil(size/2):j;const xx=col?mid+20:x+25;drawPlayer(ctx,j+1,A[i][j]||'',xx,y+125+row*30,col?x+w-25:mid-20)}}y+=cardH+cardGap}ctx.fillStyle='#64748b';ctx.font='18px system-ui, sans-serif';ctx.textAlign='center';ctx.fillText('즐거운 축구! 안전하게 뛰어요 ⚽',W/2,H-30);ctx.textAlign='left';c.toBlob(async blob=>{if(!blob)return alert('이미지 생성에 실패했어. 다시 눌러줘.');const file=new File([blob],'축구팀_편성.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'오늘 축구팀 편성',text:'오늘 축구팀 편성표',files:[file]});return}catch(e){if(e.name==='AbortError')return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='축구팀_편성.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('편성표 이미지를 저장했어. 카톡에서 사진으로 보내면 돼.')},'image/png')}catch(e){console.error(e);alert('이미지 생성 중 문제가 생겼어. 다시 한 번 눌러줘.')}}function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}function drawPlayer(ctx,num,name,x,y,right){ctx.fillStyle='#e3f4e9';ctx.beginPath();ctx.arc(x+15,y-6,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#075c38';ctx.font='bold 15px system-ui, sans-serif';ctx.textAlign='center';ctx.fillText(String(num),x+15,y-1);ctx.textAlign='left';ctx.fillStyle='#17202b';ctx.font='20px system-ui, sans-serif';ctx.fillText(name,x+40,y);if(right){ctx.strokeStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(right,y+7);ctx.lineTo(right-8,y+7);ctx.stroke()}}
</script></body></html>
