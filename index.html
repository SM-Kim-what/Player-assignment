<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚽ 오늘 축구팀 편성</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:12px}.hero,.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #0001}.hero{background:#111827;color:#fff}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#d6dbe3;font-size:13px}label{font-weight:800;display:block;margin:10px 0 7px}textarea{width:100%;min-height:170px;border:1px solid #d8dde4;border-radius:12px;padding:11px;font-size:16px;line-height:1.6}.info{font-size:13px;color:#697586;margin:8px 0}.modebox,.settings,.buttons,.savebuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modebox{margin:8px 0}.modebox button{background:#fff;border:1px solid #d8dde4}.modebox .active,.primary{background:#111827;color:#fff}.settings{margin-top:8px}.field{background:#f7f8fa;padding:10px;border-radius:11px}.field label{font-size:13px;margin:0 0 5px}.field input{width:100%;padding:9px;border:1px solid #d8dde4;border-radius:8px;font-size:17px;font-weight:700}button{border:0;border-radius:11px;padding:12px;font-weight:800;font-size:14px}.primary{width:100%;margin-top:9px}.secondary{background:#eef1f5}.share{background:#e9f5ff;color:#075985;width:100%;margin-top:8px}.savebuttons{margin-top:8px}.save{background:#eaf7ee;color:#166534}.load{background:#f1efff;color:#5b21b6}.danger{background:#fff0f0;color:#b91c1c;width:100%;margin-top:8px}.external{background:#fff7df;color:#855b00;width:100%;margin-top:8px}.game{border:1px solid #e0e5ea;border-radius:13px;overflow:hidden;margin:10px 0}.game h3{margin:0;padding:11px;background:#f7f8fa}.player{padding:7px 11px;border-bottom:1px solid #edf0f3}.badge{font-size:11px;background:#e9f5ff;color:#075985;padding:3px 7px;border-radius:99px}.stat{display:flex;gap:6px;flex-wrap:wrap}.stat span{background:#f5f6f8;padding:7px 9px;border-radius:9px;font-size:12px}.hidden{display:none}.kakaoHelp{display:none;background:#fff7df;border-radius:12px;padding:11px;font-size:13px;color:#694d00;margin-top:8px;line-height:1.5}.kakaoHelp.show{display:block}@media(max-width:430px){.teaminputs{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>⚽ 오늘 축구팀 편성</h1><p>도착 순서대로 입력하면 출전 기회를 공평하게 배정합니다.</p></div><div class="card"><label>① 오늘 온 사람</label><textarea id="names" placeholder="도착한 순서대로 한 줄에 한 명씩"></textarea><div class="info" id="count">0명</div><label>② 편성 방식</label><div class="modebox"><button id="single" class="active" onclick="setMode('single')">⚽ 상대팀과 경기</button><button id="dual" onclick="setMode('dual')">🆚 1팀 vs 2팀</button></div><div id="dualInputs" class="teaminputs"><div><b>1팀</b><textarea id="team1" placeholder="김민수&#10;이철수"></textarea></div><div><b>2팀</b><textarea id="team2" placeholder="박영수&#10;최성민"></textarea></div></div><label>③ 경기 설정</label><div class="settings"><div class="field"><label>게임 수</label><input id="gc" type="number" min="1" max="20" value="4"></div><div class="field"><label>게임당 인원</label><input id="sz" type="number" min="1" max="30" value="10"></div></div><div class="buttons" style="margin-top:9px"><button class="secondary" onclick="sample()">예시</button><button class="secondary" onclick="clearAll()">초기화</button></div><button class="primary" onclick="make()">⚽ 자동 편성하기</button><div class="savebuttons"><button class="save" onclick="saveRoster()">💾 명단 저장</button><button class="load" onclick="loadRoster()">📂 저장된 명단 불러오기</button></div><button class="danger" onclick="deleteRoster()">🗑️ 저장된 명단 삭제</button></div><div id="result" class="hidden"><div class="card"><b>편성 완료</b><div id="stats" class="stat" style="margin-top:9px"></div><button class="share" onclick="shareImage()">💬 카톡으로 바로 보내기</button><div id="kakaoHelp" class="kakaoHelp">카카오톡 안에서 열었다면 이미지 공유가 제한될 수 있어. 아래 버튼으로 <b>Chrome에서 열기</b>를 한 뒤 다시 이 앱에서 카톡 보내기를 눌러줘.</div><button id="externalBtn" class="external" onclick="openExternal()">🌐 Chrome에서 열고 카톡으로 보내기</button><button class="secondary" style="width:100%;margin-top:8px" onclick="copyText()">📋 결과 텍스트 복사</button></div><div id="games"></div></div></div><canvas id="cv" style="display:none"></canvas><script>const $=x=>document.getElementById(x),names=$("names"),gc=$("gc"),sz=$("sz");let mode="single",data=[],last="";const inKakao=/KAKAOTALK/i.test(navigator.userAgent);if(inKakao)$("kakaoHelp").classList.add("show");function list(x){let s=new Set;return x.split(/[\n,]+/).map(x=>x.trim()).filter(x=>x&&!s.has(x)&&s.add(x))}function setMode(m){mode=m;$("single").classList.toggle("active",m==="single");$("dual").classList.toggle("active",m==="dual");$("dualInputs").classList.toggle("show",m==="dual");names.style.display=m==="single"?"block":"none";$("count").style.display=m==="single"?"block":"none"}names.oninput=()=>$("count").textContent=list(names.value).length+"명";function sample(){if(mode==="single")names.value=Array.from({length:23},(_,i)=>i+1+"번 선수").join("\n");else{$("team1").value=Array.from({length:15},(_,i)=>"1팀 "+(i+1)+"번").join("\n");$("team2").value=Array.from({length:15},(_,i)=>"2팀 "+(i+1)+"번").join("\n")}names.oninput()}function clearAll(){names.value=$("team1").value=$("team2").value="";$("result").classList.add("hidden");names.oninput()}function saveRoster(){localStorage.setItem("footballRoster",JSON.stringify({mode,names:names.value,team1:$("team1").value,team2:$("team2").value,games:gc.value,size:sz.value}));alert("명단과 경기 설정을 저장했어.")}function loadRoster(){let p=JSON.parse(localStorage.getItem("footballRoster")||"null");if(!p)return alert("저장된 명단이 없어.");names.value=p.names||"";$("team1").value=p.team1||"";$("team2").value=p.team2||"";gc.value=p.games||4;sz.value=p.size||10;setMode(p.mode||"single");names.oninput();alert("저장된 명단을 불러왔어.")}function deleteRoster(){if(confirm("저장된 명단을 삭제할까?")){localStorage.removeItem("footballRoster");alert("삭제했어.")}}function pool(ps,g,n){let total=g*n,b=Math.floor(total/ps.length),e=total%ps.length,u=Object.fromEntries(ps.map(p=>[p,0])),t=Object.fromEntries(ps.map((p,i)=>[p,b+(i<e)])),out=[],c=0;for(let k=0;k<g;k++){let a=[];while(a.length<n){let p=ps[c++%ps.length];if(u[p]<t[p]&&!a.includes(p)){a.push(p);u[p]++}if(c>ps.length*g*n*3)break}out.push(a)}return[out,u]}function make(){let g=Math.max(1,+gc.value||4),n=Math.max(1,+sz.value||10);if(mode==="single"){let p=list(names.value);if(p.length<n)return alert("인원이 부족합니다.");let[a,u]=pool(p,g,n);render(a,null,u,null,g,n)}else{let a=list($("team1").value),b=list($("team2").value);if(a.length<n||b.length<n)return alert("1팀과 2팀 모두 경기당 인원 이상 입력해주세요.");let[aa,ua]=pool(a,g,n),[bb,ub]=pool(b,g,n);render(aa,bb,ua,ub,g,n)}}function render(A,B,ua,ub,g,n){data=[A,B];$("stats").innerHTML=`<span>${ub?"1팀 vs 2팀":"상대팀 경기"}</span><span>${g}게임</span><span>${ub?"팀당":"게임당"} ${n}명</span>`;let h="",txt=`⚽ 오늘 축구팀 편성\n${g}게임 · ${ub?"팀당":"게임당"} ${n}명\n\n`;for(let i=0;i<g;i++){h+=`<div class="card game"><h3>${i+1}게임 <span class="badge">${ub?"1팀 vs 2팀":"우리 팀 "+n+"명"}</span></h3>`;txt+=`${i+1}게임\n`;if(ub){h+="<b>1팀</b>";A[i].forEach((p,j)=>h+=`<div class="player">${j+1}. ${p}</div>`);h+="<b>2팀</b>";B[i].forEach((p,j)=>h+=`<div class="player">${j+1}. ${p}</div>`);txt+="[1팀]\n"+A[i].map((p,j)=>`${j+1}. ${p}`).join("\n")+"\n\n[2팀]\n"+B[i].map((p,j)=>`${j+1}. ${p}`).join("\n")}else{A[i].forEach((p,j)=>{h+=`<div class="player">${j+1}. ${p}</div>`;txt+=`${j+1}. ${p}\n`})}h+="</div>";txt+="\n"}$("games").innerHTML=h;$("result").classList.remove("hidden");last=txt;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}function copyText(){navigator.clipboard?.writeText(last);alert("복사했어. 카톡에 붙여넣으면 돼.")}function openExternal(){let url=location.href.split("#")[0];if(/Android/i.test(navigator.userAgent)){location.href="intent://"+url.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;end"}else{window.open(url,"_blank")}}function rr(c,x,y,w,h,r,fill){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.fillStyle=fill;c.fill()}function player(c,num,name,x,y,fs=17){c.fillStyle="#e0f3e8";c.beginPath();c.arc(x+14,y-6,13,0,Math.PI*2);c.fill();c.fillStyle="#075c38";c.font=`bold ${Math.max(12,fs-2)}px system-ui`;c.textAlign="center";c.fillText(num,x+14,y-1);c.textAlign="left";c.fillStyle="#24313d";c.font=`${fs}px system-ui`;c.fillText(name,x+36,y)}function shareImage(){try{let A=data[0],B=data[1],g=A.length,n=A[0]?.length||10,c=$("cv"),x=c.getContext("2d"),W=1000,m=48,head=170,gap=20,ch=Math.max(260,310+(n-10)*19),H=head+g*(ch+gap)+70;c.width=W;c.height=H;x.fillStyle="#f5f8f6";x.fillRect(0,0,W,H);x.fillStyle="#17202b";x.font="bold 48px system-ui";x.fillText("⚽ 오늘 축구팀 편성",m,66);x.fillStyle="#087443";x.font="bold 26px system-ui";x.fillText(`${g}게임  ·  ${B?"팀당":"게임당"} ${n}명`,m,105);x.fillStyle="#64748b";x.font="20px system-ui";x.fillText(B?"1팀 vs 2팀":"상대팀 경기",m,137);let y=head;for(let i=0;i<g;i++){let bx=m,bw=W-m*2;rr(x,bx,y,bw,ch,22,"#fff");x.fillStyle="#087f5b";x.font="bold 25px system-ui";x.fillText(`${i+1}게임`,bx+24,y+40);if(B){let mid=bx+bw/2;x.fillStyle="#0f766e";x.font="bold 20px system-ui";x.fillText("1팀",bx+24,y+74);x.fillText("2팀",mid+20,y+74);let fs=n>10?15:17;for(let j=0;j<n;j++){player(x,j+1,A[i][j]||"",bx+24,y+112+j*fs*1.32,fs);player(x,j+1,B[i][j]||"",mid+20,y+112+j*fs*1.32,fs)}}else{let mid=bx+bw/2,half=Math.ceil(n/2),fs=n>10?15:17;x.fillStyle="#0f766e";x.font="bold 20px system-ui";x.fillText("우리 팀",bx+24,y+74);for(let j=0;j<n;j++){let col=j>=half,row=col?j-half:j;player(x,j+1,A[i][j]||"",col?mid+20:bx+24,y+112+row*fs*1.55,fs)}}y+=ch+gap}x.fillStyle="#64748b";x.font="18px system-ui";x.textAlign="center";x.fillText("즐거운 축구! 안전하게 뛰어요 ⚽",W/2,H-24);x.textAlign="left";c.toBlob(async b=>{let f=new File([b],"축구팀_편성.png",{type:"image/png"});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){try{await navigator.share({title:"오늘 축구팀 편성",text:"오늘 축구팀 편성표",files:[f]});return}catch(e){if(e.name==="AbortError")return}}let u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="축구팀_편성.png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},"image/png")}catch(e){alert("이미지 생성 중 문제가 생겼어. 다시 눌러줘.")}}</script></body></html>
