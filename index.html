<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>⚽ 오늘 축구팀 편성</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:680px;margin:auto;padding:16px 14px 32px}.hero{background:#111827;color:white;border-radius:20px;padding:22px 18px;margin-bottom:12px}
h1{font-size:25px;margin:0 0 6px}.hero p{margin:0;color:#d6dbe3;font-size:14px}
.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #0000000b}
label{font-weight:800;display:block;margin-bottom:8px}textarea{width:100%;min-height:190px;border:1px solid #d8dde4;border-radius:13px;padding:12px;font-size:16px;line-height:1.65;resize:vertical}
.info{font-size:13px;color:#697586;margin:9px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800}.primary{width:100%;background:#111827;color:#fff;margin-top:10px}.secondary{background:#eef1f5;color:#263241}.share{background:#e9f5ff;color:#075985}
.hidden{display:none}.game{border:1px solid #e0e5ea;border-radius:14px;overflow:hidden;margin:12px 0}.game h3{margin:0;padding:12px 14px;background:#f7f8fa;font-size:17px}
.player{padding:7px 12px;border-bottom:1px solid #edf0f3;font-size:15px}.player:last-child{border-bottom:0}
.next{color:#6b7280;font-size:13px}.badge{display:inline-block;font-size:11px;background:#e9f5ff;color:#075985;padding:3px 7px;border-radius:99px;margin-left:5px}
.stat{display:flex;gap:8px;flex-wrap:wrap}.stat span{background:#f5f6f8;border-radius:10px;padding:8px 10px;font-size:13px}
.notice{background:#fff8e6;border-radius:12px;padding:10px;font-size:13px;color:#7a5310;margin-top:10px}
@media(max-width:430px){.wrap{padding:10px}.hero{border-radius:16px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>⚽ 오늘 축구팀 편성</h1>
<p>도착 순서대로 입력하면 4게임 출전 기회를 공평하게 배정합니다.</p>
</div>

<div class="card">
<label>① 오늘 온 사람</label>
<textarea id="names" placeholder="도착한 순서대로 한 줄에 한 명씩&#10;김민수&#10;이철수&#10;박영수&#10;최성민"></textarea>
<div class="info" id="count">0명</div>
<div class="buttons">
<button class="secondary" onclick="sample()">예시</button>
<button class="secondary" onclick="clearAll()">초기화</button>
</div>
<button class="primary" onclick="makeTeams()">⚽ 4게임 편성하기</button>
</div>

<div id="result" class="hidden">
<div class="card">
<b>편성 완료</b>
<div class="stat" id="stats"></div>
<button class="share" style="width:100%;margin-top:10px" onclick="shareResult()">💬 카톡으로 결과 공유</button>
<button class="secondary" style="width:100%;margin-top:8px" onclick="copyResult()">📋 결과 복사</button>
</div>
<div id="games"></div>
</div>
</div>

<script>
const el=id=>document.getElementById(id);
const namesEl=el('names');
namesEl.addEventListener('input',()=>{updateCount();localStorage.setItem('soccer_names',namesEl.value)});
const saved=localStorage.getItem('soccer_names');if(saved)namesEl.value=saved;updateCount();

function players(){
 const a=namesEl.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
 const s=new Set();return a.filter(x=>{if(s.has(x))return false;s.add(x);return true});
}
function updateCount(){el('count').textContent=players().length+'명'}
function sample(){namesEl.value=Array.from({length:23},(_,i)=>`${i+1}번 선수`).join('\n');updateCount()}
function clearAll(){namesEl.value='';localStorage.removeItem('soccer_names');updateCount();el('result').classList.add('hidden')}

let lastText='';

function makeTeams(){
 const ps=players(), n=ps.length;
 if(n<10){alert('최소 10명이 필요합니다.');return}
 // 4게임 x 10명 = 40회 출전기회를 도착순으로 순환 배정.
 // 단, 마지막에 한 번 더 배정된 사람을 다음 게임에서 우선 제외하여 출전 횟수를 최대한 균등화.
 const total=40, base=Math.floor(total/n), extra=total%n;
 // 각 선수의 목표 출전 횟수: 앞쪽(extra) 선수는 +1.
 const target=Object.fromEntries(ps.map((p,i)=>[p,base+(i<extra?1:0)]));
 const used=Object.fromEntries(ps.map(p=>[p,0]));
 const games=[];
 let cursor=0;
 for(let g=0;g<4;g++){
   let chosen=[], safety=0;
   while(chosen.length<10 && safety<1000){
     const p=ps[cursor%n]; cursor=(cursor+1)%n; safety++;
     if(used[p]<target[p] && !chosen.includes(p)){chosen.push(p);used[p]++}
   }
   // n<20 등에서 순환상 후보가 부족한 경우(정상적으로는 발생하지 않음) 보충
   if(chosen.length<10){
     for(const p of ps){if(chosen.length>=10)break;if(!chosen.includes(p)&&used[p]<target[p]){chosen.push(p);used[p]++}}
   }
   games.push(chosen);
 }
 render(games,ps,used);
}

function render(games,ps,used){
 const vals=Object.values(used), min=Math.min(...vals), max=Math.max(...vals);
 el('stats').innerHTML=`<span>${ps.length}명</span><span>4게임</span><span>게임당 10명</span><span>출전 ${min}~${max}회</span>`;
 lastText='⚽ 오늘 축구팀 편성\\n\\n'+games.map((g,i)=>`${i+1}게임\\n${g.map((p,j)=>`${j+1}. ${p}`).join('\\n')}`).join('\\n\\n');
 el('games').innerHTML=games.map((g,i)=>`<div class="card game"><h3>${i+1}게임 <span class="badge">우리 팀 10명</span></h3>${g.map((p,j)=>`<div class="player">${j+1}. ${p}</div>`).join('')}</div>`).join('');
 el('result').classList.remove('hidden');
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

async function copyResult(){
 try{await navigator.clipboard.writeText(lastText);alert('편성 결과를 복사했어. 카톡에 붙여넣으면 돼.')}
 catch(e){prompt('아래 내용을 복사해서 카톡에 붙여넣어줘.',lastText)}
}
async function shareResult(){
 if(navigator.share){try{await navigator.share({title:'오늘 축구팀 편성',text:lastText})}catch(e){}}
 else copyResult();
}
</script>
</body>
</html>
