<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="축구팀 편성"><link rel="manifest" href="manifest.webmanifest"><title>⚽ 축구팀 편성</title><style>html,body{margin:0;width:100%;height:100%;background:#f3f5f7;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}#install{display:none;position:fixed;left:14px;right:14px;bottom:14px;z-index:10;background:#111827;color:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 30px #0004;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:14px}#install button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#fff;color:#111827;margin-left:8px}.row{display:flex;align-items:center;justify-content:space-between}small{opacity:.8}</style></head><body><iframe src="../?v=14&pwa=1" title="축구팀 편성"></iframe><div id="install"><div class="row"><div><b>⚽ 축구팀 편성</b><br><small>홈 화면에 앱으로 추가할 수 있어.</small></div><button id="installBtn">홈 화면에 추가</button></div></div><script>let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').style.display='none'};window.addEventListener('appinstalled',()=>document.getElementById('install').style.display='none');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
